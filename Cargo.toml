[package]
name = "gatekeeper"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["full", "test-util", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
http = "1"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
arc-swap = "1.9.3"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
tower-http = { version = "0.7.1", features = ["limit", "request-id", "trace"] }
tower = { version = "0.5", features = ["util"] }
thiserror = "2"
